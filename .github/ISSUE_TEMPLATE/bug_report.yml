name: Bug report
description: Report a reproducible extension problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, cookies, private conversations, personal
        identifiers, or unsanitized authenticated page captures.
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Affected area
      options:
        - Dashboard or storage
        - ChatGPT
        - Google AI Overview
        - Perplexity
        - Export
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-confidential example prompts and targets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized debug output
    validations:
      required: true

