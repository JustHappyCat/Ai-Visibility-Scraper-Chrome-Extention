<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GEO Visibility Scraper</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f5f7;
        --canvas-deep: #eceff4;
        --glass: rgba(255, 255, 255, 0.72);
        --glass-strong: rgba(255, 255, 255, 0.92);
        --glass-hover: rgba(255, 255, 255, 0.96);
        --field: rgba(255, 255, 255, 0.82);
        --white: #1d1d1f;
        --ink: #1d1d1f;
        --graphite: #3a3a3c;
        --muted: #6e6e73;
        --line: rgba(15, 23, 42, 0.09);
        --line-strong: rgba(15, 23, 42, 0.16);
        --line-highlight: rgba(255, 255, 255, 0.96);
        --cyan: #007aff;
        --cyan-strong: #0071e3;
        --indigo: #5856d6;
        --mint: #28a86b;
        --amber: #c67500;
        --red: #d92d20;
        --cyan-soft: rgba(0, 122, 255, 0.09);
        --indigo-soft: rgba(88, 86, 214, 0.09);
        --green-soft: rgba(40, 168, 107, 0.1);
        --yellow-soft: rgba(198, 117, 0, 0.1);
        --red-soft: rgba(217, 45, 32, 0.08);
        --shadow-lg: 0 24px 64px rgba(61, 72, 92, 0.13);
        --shadow-md: 0 12px 34px rgba(61, 72, 92, 0.09);
        --ring: 0 0 0 3px rgba(0, 122, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background:
          radial-gradient(circle at 11% -5%, rgba(98, 189, 255, 0.3), transparent 30%),
          radial-gradient(circle at 92% 0%, rgba(175, 165, 255, 0.25), transparent 31%),
          radial-gradient(circle at 72% 90%, rgba(162, 221, 255, 0.2), transparent 34%),
          linear-gradient(145deg, #fbfbfd 0%, var(--canvas) 45%, var(--canvas-deep) 100%);
        background-attachment: fixed;
      }

      body {
        width: 100%;
        min-width: 0;
        max-width: 1180px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        color: var(--white);
        font-size: clamp(25px, 3.3vw, 38px);
        font-weight: 720;
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      h2 {
        color: var(--white);
        font-size: 14px;
        font-weight: 680;
        letter-spacing: -0.01em;
        margin: 0 0 12px;
        text-transform: none;
      }

      label {
        display: block;
        color: var(--graphite);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.01em;
        margin-bottom: 7px;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 253, 0.72)),
          var(--field);
        color: var(--ink);
        padding: 11px 12px;
        font: inherit;
        outline: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.96), 0 1px 2px rgba(35, 48, 67, 0.04);
        transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      textarea::placeholder,
      input::placeholder {
        color: #9a9aa0;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
        scrollbar-color: rgba(110, 110, 115, 0.3) transparent;
      }

      textarea:hover,
      input:hover {
        border-color: var(--line-strong);
      }

      textarea:focus,
      input:focus {
        border-color: rgba(0, 122, 255, 0.62);
        background: #ffffff;
        box-shadow: var(--ring), inset 0 1px 0 #ffffff;
      }

      [aria-invalid="true"] {
        border-color: var(--red);
        box-shadow: 0 0 0 3px var(--red-soft);
      }

      button {
        min-height: 39px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(246, 247, 249, 0.88)),
          rgba(255, 255, 255, 0.78);
        color: var(--graphite);
        padding: 9px 13px;
        font: inherit;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: -0.005em;
        cursor: pointer;
        box-shadow: inset 0 1px 0 #ffffff, 0 4px 12px rgba(50, 60, 78, 0.07);
        transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }

      button:hover:not(:disabled) {
        border-color: var(--line-strong);
        background:
          linear-gradient(180deg, #ffffff, rgba(248, 249, 251, 0.94)),
          var(--glass-hover);
        color: var(--ink);
        box-shadow: inset 0 1px 0 #ffffff, 0 8px 18px rgba(50, 60, 78, 0.1);
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: none;
        border-color: var(--cyan);
        box-shadow: var(--ring);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      button.primary {
        border-color: rgba(0, 113, 227, 0.62);
        background: linear-gradient(180deg, #0a84ff 0%, #0071e3 100%);
        color: #ffffff;
        font-weight: 720;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), 0 8px 20px rgba(0, 113, 227, 0.22);
      }

      button.primary:hover:not(:disabled) {
        border-color: rgba(0, 102, 204, 0.72);
        background: linear-gradient(180deg, #168cff 0%, #006edb 100%);
        color: #ffffff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 10px 24px rgba(0, 113, 227, 0.27);
      }

      button.danger {
        border-color: rgba(217, 45, 32, 0.14);
        background: rgba(217, 45, 32, 0.035);
        color: #b42318;
      }

      button.danger:hover:not(:disabled) {
        border-color: rgba(217, 45, 32, 0.28);
        background: var(--red-soft);
        color: #b42318;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.38;
        filter: saturate(0.45);
      }

      .app-shell {
        display: grid;
        gap: 16px;
      }

      .brand-header,
      .panel,
      .toolbar {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.52) 55%),
          var(--glass);
        backdrop-filter: blur(28px) saturate(125%);
        -webkit-backdrop-filter: blur(28px) saturate(125%);
        box-shadow: inset 0 1px 0 var(--line-highlight), var(--shadow-md);
      }

      .brand-header::after,
      .panel::after,
      .toolbar::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.42), transparent 28%, transparent 72%, rgba(108, 155, 224, 0.035));
        mix-blend-mode: screen;
      }

      .brand-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 20px;
        align-items: center;
        min-height: 134px;
        border-color: rgba(15, 23, 42, 0.08);
        border-radius: 20px;
        padding: 28px 30px;
        box-shadow: inset 0 1px 0 #ffffff, var(--shadow-lg);
      }

      .brand-header::before {
        content: "";
        position: absolute;
        width: 270px;
        height: 270px;
        right: -86px;
        top: -172px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(118, 162, 255, 0.24), rgba(107, 205, 255, 0.1) 48%, transparent 70%);
        filter: blur(4px);
        pointer-events: none;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        min-width: 0;
        position: relative;
        z-index: 1;
      }

      .brand-copy {
        min-width: 0;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--cyan-strong);
        font-size: 10px;
        font-weight: 720;
        letter-spacing: 0.16em;
        margin-bottom: 11px;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 12px rgba(0, 122, 255, 0.34);
      }

      .brand-copy > p:not(.eyebrow) {
        max-width: 650px;
        color: var(--muted);
        font-size: 14px;
        margin-top: 10px;
      }

      .section-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(278px, 0.8fr);
        gap: 16px;
        align-items: stretch;
      }

      .panel {
        border-radius: 18px;
        padding: 18px;
      }

      .input-panel {
        display: grid;
        gap: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        position: relative;
        z-index: 1;
      }

      .subtle {
        color: var(--muted);
        font-size: 11px;
      }

      .field-note {
        margin-top: 6px;
      }

      .field-error {
        color: #b42318;
        font-size: 11px;
        margin-top: 6px;
      }

      .field-error[hidden],
      .alert[hidden] {
        display: none;
      }

      .alert {
        position: relative;
        z-index: 1;
        border: 1px solid rgba(217, 45, 32, 0.2);
        border-radius: 12px;
        padding: 10px 12px;
        background: var(--red-soft);
        color: #8f1d14;
        font-weight: 600;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .engine-panel {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
      }

      .engine-group {
        display: grid;
        align-content: start;
        gap: 8px;
      }

      .engine-list {
        display: grid;
        align-content: start;
        gap: 8px;
      }

      .check {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.62);
        color: var(--graphite);
        font-weight: 650;
        margin: 0;
        padding: 9px 11px 9px 13px;
        box-shadow: inset 0 1px 0 #ffffff, 0 1px 2px rgba(35, 48, 67, 0.03);
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
      }

      .check:hover {
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink);
      }

      .engine-name {
        min-width: 0;
      }

      .check input {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        width: 38px;
        height: 22px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 999px;
        background: rgba(120, 120, 128, 0.2);
        padding: 0;
        box-shadow: inset 0 1px 3px rgba(60, 60, 67, 0.12);
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .check input::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 2px;
        top: 2px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 3px rgba(60, 60, 67, 0.28);
        transition: transform 180ms cubic-bezier(0.2, 0.75, 0.3, 1), background 160ms ease;
      }

      .check input:checked {
        border-color: rgba(0, 113, 227, 0.48);
        background: linear-gradient(180deg, #36a0ff, var(--cyan-strong));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 2px 8px rgba(0, 113, 227, 0.18);
      }

      .check input:checked::after {
        background: #ffffff;
        transform: translateX(16px);
      }

      .check input:focus-visible {
        border-color: var(--cyan);
        box-shadow: var(--ring);
      }

      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .settings-grid label {
        color: var(--muted);
      }

      .settings-grid input {
        min-height: 40px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-radius: 16px;
        padding: 10px;
      }

      .toolbar-group {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
        position: relative;
        z-index: 1;
      }

      .toolbar-group + .toolbar-group {
        padding-left: 12px;
        border-left: 1px solid var(--line);
      }

      .toolbar button {
        white-space: nowrap;
      }

      #startBtn {
        min-width: 118px;
      }

      .metric {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 5px 10px;
        background: rgba(255, 255, 255, 0.66);
        color: var(--muted);
        box-shadow: inset 0 1px 0 #ffffff;
      }

      .metric b {
        color: var(--white);
        font-weight: 700;
      }

      .result {
        position: relative;
        z-index: 1;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.64);
        margin-top: 8px;
        box-shadow: inset 0 1px 0 #ffffff, 0 2px 8px rgba(44, 55, 75, 0.035);
        transition: border-color 150ms ease, background 150ms ease;
      }

      .result:hover {
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.92);
      }

      .result-title {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
        color: var(--white);
        font-weight: 680;
      }

      .badge {
        display: inline-block;
        border: 1px solid rgba(88, 86, 214, 0.14);
        border-radius: 999px;
        background: var(--indigo-soft);
        color: #4d4bc4;
        padding: 3px 8px;
        font-size: 10px;
        font-weight: 720;
        letter-spacing: 0.035em;
      }

      .ok {
        border-color: rgba(40, 168, 107, 0.18);
        background: var(--green-soft);
        color: #18794e;
      }

      .warn {
        border-color: rgba(198, 117, 0, 0.18);
        background: var(--yellow-soft);
        color: #9a5a00;
      }

      .fail {
        border-color: rgba(217, 45, 32, 0.18);
        background: var(--red-soft);
        color: #b42318;
      }

      progress {
        width: 100%;
        height: 8px;
        margin-top: 13px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: rgba(118, 118, 128, 0.15);
        box-shadow: inset 0 1px 2px rgba(60, 60, 67, 0.1);
      }

      progress::-webkit-progress-bar {
        background: rgba(118, 118, 128, 0.15);
        border-radius: 999px;
      }

      progress::-webkit-progress-value {
        border-radius: 999px;
        background: linear-gradient(90deg, #0a84ff, #0071e3 62%, #5856d6);
        box-shadow: 0 1px 4px rgba(0, 113, 227, 0.18);
      }

      pre {
        position: relative;
        z-index: 1;
        max-height: 170px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        margin: 8px 0 0;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(246, 247, 249, 0.9);
        color: #424245;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        scrollbar-color: rgba(110, 110, 115, 0.3) transparent;
      }

      #output {
        min-height: 230px;
      }

      #manualFeedback:empty {
        display: none;
      }

      #manualFeedback:focus-visible,
      #formErrorSummary:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      #output > * {
        position: relative;
        z-index: 1;
      }

      #output > h2 {
        margin-top: 18px;
      }

      ::selection {
        background: rgba(0, 122, 255, 0.18);
        color: var(--white);
      }

      @media (max-width: 960px) {
        body {
          padding: 18px;
        }

        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .toolbar-group {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          width: 100%;
        }

        .toolbar-group + .toolbar-group {
          padding: 10px 0 0;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .toolbar button {
          width: 100%;
          white-space: normal;
        }
      }

      @media (max-width: 760px) {
        body {
          padding: 12px;
        }

        .section-grid {
          grid-template-columns: 1fr;
        }

        .brand-header {
          min-height: 118px;
          padding: 20px;
        }

        .toolbar-group {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .metric {
          max-width: 100%;
          flex-wrap: wrap;
        }
      }

      @media (max-width: 420px) {
        body {
          padding: 8px;
        }

        .brand-header,
        .panel {
          border-radius: 14px;
          padding: 14px;
        }

        .settings-grid,
        .toolbar-group {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (forced-colors: active) {
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
          outline: 2px solid ButtonText;
          outline-offset: 2px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="brand-header">
        <div class="brand-lockup">
          <div class="brand-copy">
            <p class="eyebrow">AI answer intelligence</p>
            <h1>GEO Visibility Scraper</h1>
            <p>Measure brand presence across AI answers, sources, and search experiences.</p>
          </div>
        </div>
      </header>

      <div class="section-grid">
        <section class="panel input-panel">
          <h2>Campaign inputs</h2>
          <div class="grid">
            <div>
              <label for="prompts">Prompts</label>
              <textarea id="prompts" rows="5" aria-describedby="prompts-note prompts-error" placeholder="Best CRM for small agencies&#10;Top accounting tools for startups"></textarea>
              <p id="prompts-note" class="subtle field-note">Enter one prompt per line. Commas remain part of a prompt.</p>
              <p id="prompts-error" class="field-error" hidden></p>
            </div>
            <div>
              <label for="targets">Target businesses</label>
              <textarea id="targets" rows="5" aria-describedby="targets-note targets-error" placeholder="Acme CRM | Acme, Acme Software | acme.com&#10;Northwind | Northwind Analytics | northwind.ai"></textarea>
              <p id="targets-note" class="subtle field-note">Format: name | aliases | domains.</p>
              <p id="targets-error" class="field-error" hidden></p>
            </div>
          </div>
        </section>

        <section class="panel engine-panel">
          <h2 id="engines-heading">Engines</h2>
          <div class="engine-group" role="group" aria-labelledby="engines-heading" aria-describedby="engines-error">
            <div class="engine-list">
              <label class="check"><span class="engine-name">ChatGPT</span><input type="checkbox" name="engine" value="chatgpt" checked /></label>
              <label class="check"><span class="engine-name">Google AI Overview</span><input type="checkbox" name="engine" value="google-aio" checked /></label>
              <label class="check"><span class="engine-name">Perplexity</span><input type="checkbox" name="engine" value="perplexity" checked /></label>
            </div>
            <p id="engines-error" class="field-error" hidden></p>
          </div>
          <div class="settings-grid">
            <div>
              <label for="throttle">Delay (ms)</label>
              <input id="throttle" type="number" min="0" max="600000" step="500" value="3000" aria-describedby="throttle-error" />
              <p id="throttle-error" class="field-error" hidden></p>
            </div>
            <div>
              <label for="retries">Retries</label>
              <input id="retries" type="number" min="0" max="2" step="1" value="1" aria-describedby="retries-error" />
              <p id="retries-error" class="field-error" hidden></p>
            </div>
          </div>
        </section>
      </div>

      <div id="formErrorSummary" class="alert" role="alert" tabindex="-1" hidden></div>

      <div class="toolbar">
        <div class="toolbar-group">
          <button id="startBtn" class="primary" type="button">Start Batch</button>
          <button id="cancelBtn" type="button">Cancel</button>
          <button id="scrapeBtn" type="button">Scrape Active Tab</button>
          <button id="runActiveBtn" type="button">Run Active Tab</button>
        </div>
        <div class="toolbar-group">
          <button id="csvBtn" type="button">Export CSV</button>
          <button id="reportBtn" type="button">Export Report</button>
          <button id="clearHistoryBtn" class="danger" type="button">Clear History</button>
          <button id="resetBtn" class="danger" type="button">Clear All Extension Data</button>
        </div>
      </div>

      <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <section id="manualFeedback" class="panel" tabindex="-1" aria-label="Active tab feedback"></section>
      <section id="output" class="panel" aria-labelledby="output-heading" aria-busy="false">
        <h2 id="output-heading">Run status</h2>
        <p class="subtle">Loading saved state…</p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
